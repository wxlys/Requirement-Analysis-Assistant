<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 需求分析助手</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ static_version }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='extra.css') }}?v={{ static_version }}">
</head>
<body>
  <main class="shell login-shell">
    <header class="topbar">
      <div class="brand-mark">QA</div>
      <div><p class="eyebrow">QUALITY ASSURANCE WORKSPACE</p><h1>需求分析助手</h1></div>
      <span class="local-badge">本地质量门禁</span>
    </header>
    <div class="login-layout">
      <section class="login-visual" aria-label="需求分析工作场景">
        <img src="https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1200&q=85" alt="团队协作分析需求" loading="eager">
        <div class="visual-copy">
          <span class="visual-kicker">MAKE IDEAS CLEAR</span>
          <h2>把复杂需求<br>变成清晰行动</h2>
          <p>从每一个细节出发，构建可靠、可验证的产品方案。</p>
        </div>
      </section>
      <section class="panel login-panel">
        <div class="login-intro">
          <div>
            <span class="login-kicker">WELCOME BACK</span>
            <h2>欢迎回来</h2>
            <p>登录后继续使用需求分析助手</p>
          </div>
        </div>
        <form method="post" action="/login" class="login-form">
          {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
          <label><span class="field-label">用户名</span><span class="input-wrap"><input name="username" autocomplete="username" placeholder="请输入用户名" required autofocus></span></label>
          <label><span class="field-label">密码</span><span class="input-wrap"><input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></span></label>
          <button type="submit" class="primary login-submit">登录 <span>→</span></button>
        </form>
        <p class="login-note"><span aria-hidden="true">●</span> 本地安全连接，数据仅保存在当前环境</p>
      </section>
    </div>
  </main>
</body>
</html>
